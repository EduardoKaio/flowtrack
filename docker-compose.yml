services:
  postgres:
    image: postgres:16-alpine
    container_name: flowtrack-postgres
    environment:
      POSTGRES_DB: flowtrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      PGTZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - flowtrack-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend/flowtrack
    container_name: flowtrack-backend
    environment:
      SPRING_APPLICATION_NAME: flowtrack
      SERVER_PORT: 8080

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowtrack
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin123

      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "true"
      SPRING_FLYWAY_CLEAN_DISABLED: "true"

      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flowtrack-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/flowtrack-app
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: flowtrack-frontend
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - flowtrack-network
    restart: unless-stopped
  
  nginx:
    image: nginx:alpine
    container_name: flowtrack-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - flowtrack-network
    restart: unless-stopped


networks:
  flowtrack-network:
    driver: bridge

volumes:
  postgres_data:
