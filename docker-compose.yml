services:
  postgres:
    image: postgres:16-alpine
    container_name: flowtrack-postgres
    environment:
      POSTGRES_DB: flowtrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      PGTZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - flowtrack-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend/flowtrack
    container_name: flowtrack-backend
    
    # 1. Carrega todas as variáveis do seu arquivo .env
    env_file:
      - .env
      
    # 2. Sobrescreve APENAS o que precisa ser diferente dentro do Docker
    environment:
      # AQUI ESTÁ O TRUQUE: Mudamos de localhost para postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowtrack?timezone=America/Sao_Paulo
      
      # Garantir que o driver seja lido (caso o .env falhe)
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flowtrack-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/flowtrack-app
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: flowtrack-frontend
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - flowtrack-network
    restart: unless-stopped
  
  nginx:
    image: nginx:alpine
    container_name: flowtrack-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Mapeia a pasta onde o Certbot salvou as chaves
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - flowtrack-network
    restart: unless-stopped

networks:
  flowtrack-network:
    driver: bridge

volumes:
  postgres_data: