spring.application.name=${SPRING_APPLICATION_NAME}
server.port=${SERVER_PORT}


# ============================================
# PRODUÇÃO / AIVEN POSTGRES (Não funciona na rede da UFRN)
# Configure via variáveis de ambiente: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# ============================================

# ============================================
# Configurações do Banco de Dados
# Todas as configurações devem estar no arquivo .env na raiz do projeto
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

# ============================================
# Configurações HikariCP (Connection Pool)
# ============================================
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT}


# ============================================
# Configurações gerais JPA/Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT}
spring.jpa.properties.hibernate.jdbc.time_zone=${SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_TIME_ZONE}

# ============================================
# Configurações Flyway
# ============================================
spring.flyway.encoding=${SPRING_FLYWAY_ENCODING:UTF-8}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE}
spring.flyway.validate-on-migrate=${SPRING_FLYWAY_VALIDATE_ON_MIGRATE}
spring.flyway.clean-disabled=${SPRING_FLYWAY_CLEAN_DISABLED}

# ============================================
# Configurações de Logging (opcionais)
# Descomente e configure via variáveis de ambiente se necessário
# ============================================
#logging.level.org.hibernate.SQL=${LOGGING_LEVEL_ORG_HIBERNATE_SQL}
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL_BASICBINDER}

# ============================================
# Configurações de Timezone (Jackson)
# ============================================
spring.jackson.time-zone=${SPRING_JACKSON_TIME_ZONE}
spring.jackson.date-format=${SPRING_JACKSON_DATE_FORMAT}
spring.jackson.deserialization.adjust-dates-to-context-time-zone=${SPRING_JACKSON_DESERIALIZATION_ADJUST_DATES_TO_CONTEXT_TIME_ZONE}

# ============================================
# Configurações JWT
# ============================================
JWT_SECRET=mySecretKey12345678901234567890123456789012345678901234567890
JWT_EXPIRATION=86400000