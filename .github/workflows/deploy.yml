name: Deploy to AWS

on:
  push:
    branches:
      - main  # Roda sempre que der push na main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST_DNS }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          # Entra na pasta do projeto
          cd flowtrack
          
          # Garante que temos a versão mais recente do código
          git pull origin main
          
          # Recria os containers (Baixa novas imagens se houver build, e recria)
          # O --build garante que o backend/frontend sejam recompilados
          docker compose up -d --build
          
          # Remove imagens antigas para não lotar o disco da AWS (Opcional mas recomendado)
          docker image prune -f